<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنتجات</title>
  <style>
    .menu-item {
      background: linear-gradient(145deg, rgba(245, 245, 245, 0.9), rgba(255, 255, 255, 0.95));
      border: 1px solid rgba(107, 108, 201, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin: 15px;
      text-align: center;
    }
    
    .add-to-cart-btn {
      background: radial-gradient(circle at 10% -30%, #71ddd8, #72c9df 45%, #61c6d8 100%);
      color: #244788;
      border: none;
      border-radius: 25px;
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s ease;
    }
    
    .add-to-cart-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(112, 201, 207, 0.4);
    }
    
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .cart-notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #28a745;
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      z-index: 1000;
      animation: slideIn 0.3s ease;
      display: none;
    }
    
    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body>

<!-- Navigation -->
<nav>
  <a href="index.html">المنتجات</a></li>
                <a href="register.html">التسجيل | Register</a></li>
                <a href="menu.html">قائمة الطعام | Menu</a></li>
                              
</nav>

<hr />

<h1>المنتجات</h1>

<div class="menu-grid">
  <!-- كبسة دجاج -->
  <div class="menu-item">
    <h2>الساعة الذكية</h2>
    <img src="images/WhatsApp Image 2026-05-04 at 6.04.09 PM.jpeg" alt="كبسة دجاج" width="250" style="border-radius: 10px;">
    <p>ساعة لمراقبة صحة المعتمرين ولحجاج</p>
    <p>السعر: <strong>15 ريال</strong></p>
    <button class="add-to-cart-btn" onclick="addToCart('كبسة دجاج', 'Chicken Kabsa', 30, 'images/kabsa.jpg')">
      أضف للسلة | Add to Cart
    </button>
  </div>

  <!-- مندي لحم -->
  <div class="menu-item">
    <h2>سياراة نقل </h2>
    <img src="images/WhatsApp Image 2026-05-04 at 6.04.09 PM (2).jpeg" alt="مندي لحم" width="250" style="border-radius: 10px;">
    <p>سياراة لنقل الحجاج و المعتمرين</p>
    <p>السعر: <strong>45 ريال</strong></p>
    <button class="add-to-cart-btn" onclick="addToCart('مندي لحم', 'Lamb Mandi', 45, 'images/mandi.jpg')">
       أضف للسلة | Add to Cart
    </button>
  </div>

  

 </div>

<!-- إشعار الإضافة -->
<div id="cartNotification" class="cart-notification">
  ✅ تمت الإضافة إلى السلة بنجاح!
</div>

<script>
  // دالة إضافة عنصر للسلة
  function addToCart(name, nameEn, price, image) {
    // إنشاء كائن العنصر
    const item = {
      id: Date.now(), // رقم فريد
      name: name,
      nameEn: nameEn,
      price: price,
      image: image,
      quantity: 1
    };
    
    // جلب السلة الحالية من localStorage
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    
    // التحقق إذا العنصر موجود مسبقاً
    const existingItemIndex = cart.findIndex(cartItem => cartItem.name === name);
    
    if (existingItemIndex !== -1) {
      // إذا موجود نزيد الكمية فقط
      cart[existingItemIndex].quantity += 1;
    } else {
      // إذا جديد نضيفه
      cart.push(item);
    }
    
    // حفظ السلة المحدثة
    localStorage.setItem('cart', JSON.stringify(cart));
    
    // إظهار الإشعار
    showNotification(name);
    
    // تحديث عداد السلة في النافبار (إذا موجود)
    updateCartCounter();
  }
  
  // دالة إظهار الإشعار
  function showNotification(itemName) {
    const notification = document.getElementById('cartNotification');
    notification.innerHTML = `✅ تم إضافة ${itemName} إلى السلة بنجاح!`;
    notification.style.display = 'block';
    
    setTimeout(() => {
      notification.style.display = 'none';
    }, 3000);
  }
  
  // دالة تحديث عداد السلة
  function updateCartCounter() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const totalItems = cart.reduce((total, item) => total + item.quantity, 0);
    
    // تحديث العداد في النافبار إذا موجود
    const cartCounter = document.getElementById('cartCounter');
    if (cartCounter) {
      cartCounter.textContent = `(${totalItems})`;
    }
  }
  
  // تحديث العداد عند تحميل الصفحة
  document.addEventListener('DOMContentLoaded', function() {
    updateCartCounter();
  });
</script>

</body>
</html>
